[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "easygsc"
version = "0.3.1"
description = "Minimal, transparent, read-only MCP server for Google Search Console."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["mcp", "google-search-console", "seo", "claude"]
# Application, not library: runtime deps are pinned exactly because `uvx
# easygsc@x.y.z` resolves from these ranges, not from uv.lock.
# Transitive dependencies are intentionally not pinned.
dependencies = [
    "mcp==1.30.0",
    "google-auth==2.62.0",
    "google-auth-oauthlib==1.5.0",
]

[project.scripts]
easygsc = "easygsc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/easygsc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
