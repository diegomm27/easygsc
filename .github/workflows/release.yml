name: Release to PyPI

# Publishes on GitHub Release (tag). Uses PyPI Trusted Publishing: no API token
# secrets required. Configure the "pypi" environment on PyPI with this repo's
# workflow name and path first.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build distributions
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
